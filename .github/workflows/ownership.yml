name: ownership

on:
  push:
    branches: [master, miyako-capture-v2-ownership-audit]
    paths:
      - '4DPlugin-Capture.cpp'
      - '4DPlugin-Capture.h'
      - 'support/**'
      - '4D Plugin API/**'
      - 'tests/ownership/**'
      - '.github/workflows/ownership.yml'
  pull_request:
    branches: [master]
    paths:
      - '4DPlugin-Capture.cpp'
      - '4DPlugin-Capture.h'
      - 'support/**'
      - '4D Plugin API/**'
      - 'tests/ownership/**'
      - '.github/workflows/ownership.yml'

permissions:
  contents: read

jobs:
  harness:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fixed tree (no failures expected)
        run: python3 tests/ownership/run.py --tree . --out "$RUNNER_TEMP/fixed" --expect-none
      - name: Unfixed baseline 084615c (named failures expected)
        run: |
          mkdir "$RUNNER_TEMP/baseline"
          git archive 084615c85c530a489174194d705b2e390c3dfd3e | tar -x -C "$RUNNER_TEMP/baseline"
          python3 tests/ownership/run.py --tree "$RUNNER_TEMP/baseline" --out "$RUNNER_TEMP/baseline-out" \
            --expect tests/ownership/baseline-expected-failures.txt
